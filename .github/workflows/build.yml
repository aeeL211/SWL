name: Build SWLMods

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      log:
        description: "Enable logcat output (off = smallest .so)"
        type: boolean
        default: true

env:
  # Pinned. Newest on Maven Central at time of writing; 1.1.1 is the previous stable line.
  SHADOWHOOK_VERSION: "2.0.1"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Download and extract ShadowHook AAR
        run: |
          set -euo pipefail
          BASE="https://repo1.maven.org/maven2/com/bytedance/android/shadowhook/${SHADOWHOOK_VERSION}"
          curl -fsSL --retry 3 -o shadowhook.aar      "${BASE}/shadowhook-${SHADOWHOOK_VERSION}.aar"
          curl -fsSL --retry 3 -o shadowhook.aar.sha1 "${BASE}/shadowhook-${SHADOWHOOK_VERSION}.aar.sha1"
          echo "$(cut -d' ' -f1 shadowhook.aar.sha1 | tr -d '\r\n')  shadowhook.aar" | sha1sum -c -
          mkdir -p shadowhook
          unzip -q shadowhook.aar -d shadowhook

          # Fail fast if the AAR layout is not what CMakeLists.txt expects
          HDR="shadowhook/prefab/modules/shadowhook/include/shadowhook.h"
          SO="shadowhook/prefab/modules/shadowhook/libs/android.${{ matrix.abi }}/libshadowhook.so"
          for f in "$HDR" "$SO"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f"
              find shadowhook -type f | sort
              exit 1
            fi
          done
          echo "AAR layout OK:"; ls -la "$HDR" "$SO"

      - name: Configure CMake
        run: |
          cmake -S . -B build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSHADOWHOOK_ROOT=${{ github.workspace }}/shadowhook \
            -DFB_LOG=${{ (github.event_name == 'workflow_dispatch' && !inputs.log) && 'OFF' || 'ON' }}

      - name: Build
        run: cmake --build build/${{ matrix.abi }} --config Release -j$(nproc)

      - name: Collect artifact
        run: |
          set -euo pipefail
          OUT="dist/lib/${{ matrix.abi }}"
          mkdir -p "$OUT"
          cp "build/${{ matrix.abi }}/lib/${{ matrix.abi }}/libfbrian.so" "$OUT/"
          cp "shadowhook/prefab/modules/shadowhook/libs/android.${{ matrix.abi }}/libshadowhook.so" "$OUT/"
          ls -l "$OUT"
          wc -c "$OUT/libfbrian.so"

      - name: Verify ELF (class, machine, DT_NEEDED)
        run: |
          set -euo pipefail
          RE="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          OUT="dist/lib/${{ matrix.abi }}"

          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            WANT_CLASS="ELF64"; WANT_MACHINE="AArch64"
          else
            WANT_CLASS="ELF32"; WANT_MACHINE="ARM"
          fi

          for so in libfbrian.so libshadowhook.so; do
            echo "== $so"
            "$RE" -h "$OUT/$so" | grep -E "Class:|Machine:"
            "$RE" -h "$OUT/$so" | grep -Eq "Class: +${WANT_CLASS}\$"     || { echo "::error::$so wrong ELF class";   exit 1; }
            "$RE" -h "$OUT/$so" | grep -Eq "Machine: +${WANT_MACHINE}\$" || { echo "::error::$so wrong machine";     exit 1; }
            "$RE" -d "$OUT/$so" | grep -E "NEEDED|SONAME" || true
          done

          # libfbrian must depend on the bare soname, not a build-machine path
          "$RE" -d "$OUT/libfbrian.so" | grep -q "NEEDED.*\[libshadowhook\.so\]" \
            || { echo "::error::libfbrian.so does not list NEEDED [libshadowhook.so]"; exit 1; }

          # libfbrian must export its own JNI_OnLoad, else ART picks libshadowhook's and fails
          "$RE" --dyn-syms "$OUT/libfbrian.so" | grep -Eq "FUNC +GLOBAL +DEFAULT +[0-9]+ JNI_OnLoad\$" \
            || { echo "::error::libfbrian.so does not export JNI_OnLoad"; exit 1; }

          # Informational: a shared C++ runtime would have to be packaged too
          if "$RE" -d "$OUT/libfbrian.so" | grep -q "libc++_shared"; then
            echo "::warning::libfbrian.so needs libc++_shared.so"
          fi

      - name: Upload artifact (per ABI)
        uses: actions/upload-artifact@v4
        with:
          name: libfbrian-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all ABI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libfbrian-*
          merge-multiple: true
          path: dist

      - name: Show final tree
        run: find dist -type f | sort

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfbrian-all
          path: dist/
          if-no-files-found: error
